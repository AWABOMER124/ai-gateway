{% extends "base.html" %}
{% block title %}تسجيل الدخول — Awab AI Office{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin:60px auto 0;">
  <h1>تسجيل الدخول</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/login">
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" required>
    <div style="margin-top:16px;"><button type="submit">دخول</button></div>
  </form>
  <p class="muted" style="margin-top:16px;">
    ما عندك حساب؟ اطلب من مالك الفريق تشغيل <code class="mono">scripts/create_dashboard_user.py</code>.
  </p>
</div>
{% endblock %}
