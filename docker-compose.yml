services:
  api:
    build: .
    container_name: awab-ai-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    ports:
      - "0.0.0.0:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # شبكة مشتركة مع postgres لو على نفس السيرفر مستقبلاً
