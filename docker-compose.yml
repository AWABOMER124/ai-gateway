services:
  api:
    build: .
    container_name: awab-ai-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    ports:
      - "0.0.0.0:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - default
      - awab-ai-postgres_default

    # Resource cap — this server also hosts the live Waslak Merchant OS
    # production containers. Without a limit, a runaway GPT retry loop or a
    # large file analysis here could starve them (host has 2 vCPU / 8GiB total).
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

networks:
  default: {}
  awab-ai-postgres_default:
    external: true
